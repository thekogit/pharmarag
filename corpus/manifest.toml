# The benchmark corpus: DailyMed SPL set ids, fetched by `python -m scripts.fetch_corpus`.
#
# Each compound has the manufacturer's current label. Four compounds also have an older label
# of the same product published by a repackager. Those older labels are real, superseded
# versions (different dosing, contraindications or warnings), so the freshness gate and the
# contradiction detector are tested on genuine version conflicts, not synthetic ones.
# Which label is current is decided at ingest time from the SPL effectiveTime, not here.

